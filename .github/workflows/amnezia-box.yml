name: amnezia-box

# Builds amnezia-box (Amnezia's sing-box fork with the AmneziaWG endpoint) for Windows from a pinned source commit
# and attaches it to a pre-release of this repository. Amnezia publishes no binaries. The app downloads exactly
# this build: AmneziaBox.Version and the SHA-256 printed here go into src/Obkhodiki.Core/Vpn/AmneziaBoxRelease.cs.
# Pre-release, so /releases/latest (the app's own self-update) never points here.
on:
  workflow_dispatch:
    inputs:
      version:
        description: amnezia-box release tag without "v" (must match AmneziaBox.Version)
        required: true
        default: 1.260910.0
      commit:
        description: Commit the tag points to (must match AmneziaBox.SourceCommit)
        required: true
        default: 16724484cfa00d9b2c14d8280dc055564e2e12ba

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - name: Check inputs
        run: |
          [[ "$VERSION" =~ ^1\.[0-9]{6}\.[0-9]+$ ]] || { echo "Bad version"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Bad commit"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: amnezia-vpn/amnezia-box
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Check the tag points to the commit
        run: |
          git fetch --no-tags --depth 1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          test "$(git rev-parse "v$VERSION^{commit}")" = "$COMMIT"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.5
          cache: false

      - name: Build
        env:
          GOTOOLCHAIN: local
          GOWORK: "off"
          CGO_ENABLED: "0"
          GOOS: windows
        run: |
          tags=with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_awg
          for arch in amd64 arm64; do
            mkdir -p "out/$arch"
            GOARCH=$arch go build -trimpath -tags "$tags" \
              -ldflags "-X github.com/sagernet/sing-box/constant.Version=$VERSION -s -w -buildid=" \
              -o "out/$arch/amnezia-box.exe" ./cmd/sing-box
            cp LICENSE "out/$arch/LICENSE"
            printf 'amnezia-box %s\nSource: https://github.com/amnezia-vpn/amnezia-box/tree/%s\nGPL-3.0-or-later, see LICENSE.\n' \
              "$VERSION" "$COMMIT" > "out/$arch/SOURCE.txt"
            (cd "out/$arch" && zip -X -q "../../amnezia-box-$VERSION-windows-$arch.zip" amnezia-box.exe LICENSE SOURCE.txt)
          done
          sha256sum amnezia-box-*.zip | tee SHA256SUMS.txt
          sha256sum out/*/amnezia-box.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amnezia-box
          path: |
            amnezia-box-*.zip
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: amnezia-box

      - name: Pre-release
        run: |
          {
            echo "amnezia-box $VERSION for Obkhodiki (AmneziaWG). Built by this workflow from"
            echo "https://github.com/amnezia-vpn/amnezia-box/tree/$COMMIT (GPL-3.0-or-later)."
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "amnezia-box-v$VERSION" amnezia-box-*.zip \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "amnezia-box $VERSION" --notes-file notes.md --prerelease
